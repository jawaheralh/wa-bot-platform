<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — منصة بوت واتساب</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <style>
    /**
     * صفحة الدخول: جسر بين الصفحة الرئيسية واللوحة.
     *
     * تأخذ خلفية الهبوط العميقة وبطاقته البيضاء وحقوله ذات الخط
     * السفلي، لأن العميل يصل إليها من الصفحة الرئيسية مباشرة —
     * وانقطاع الهوية في هذه الخطوة بالذات يجعله يتساءل إن كان
     * الرابط صحيحاً.
     */
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background: var(--deep);
    }

    /* العرض على الغلاف لا على البطاقة: البطاقة داخل شبكة مركزية،
       و100% عليها يعود على غلاف بلا عرض محدّد فينزاح المحور. */
    .shell { width: min(400px, 100%); }

    .box {
      width: 100%;
      background: #fff;
      border: 0;
      border-radius: 24px;
      box-shadow: 0 18px 48px rgba(59, 34, 41, 0.28);
      padding: 34px 30px 30px;
      margin: 0;
    }

    .home { display: inline-block; color: #fff; text-decoration: none; opacity: .8; font-size: 15px; margin-bottom: 14px }
    /* السهم كصندوق مستقل لا كحرف: الحرف المحايد في سطر عربي يقفز
       إلى الطرف الآخر حسب ما حوله، فيشير إلى عكس الوجهة. */
    .home::before { content: '→'; display: inline-block; margin-inline-end: 6px }
    .home:hover { opacity: 1 }

    .kicker { font-family: 'Amiri', serif; font-style: italic; font-size: 24px; color: var(--accent); margin: 0 }
    .box h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px }
    .box > p.muted { margin: 0 0 6px; font-size: 15px }

    /* حقول بخط سفلي وتسمية عائمة — نفس نموذج الصفحة الرئيسية */
    .field { position: relative; margin-top: 28px }
    .field input {
      width: 100%; border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
      background: transparent; padding: 8px 2px; font: inherit; font-size: 16px; color: var(--ink);
    }
    .field input:focus { outline: none; border-bottom-color: var(--accent) }
    .field input:read-only { color: var(--muted) }
    .field label {
      position: absolute; inset-inline-start: 2px; top: 8px; margin: 0;
      color: var(--muted); font-size: 16px; pointer-events: none; transition: .15s ease;
    }
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      top: -14px; font-size: 13px; color: var(--accent);
    }

    .btn.wide { width: 100%; padding: 13px; font-size: 16px; margin-top: 26px }
    .hint { margin: 8px 0 0; font-size: 13px; color: var(--muted) }
    #error, #note { margin: 18px 0 0 }
    .hint a { color: var(--accent-dark) }
  </style>
</head>
<body>
  <div class="shell">
    <a class="home" href="/">الصفحة الرئيسية</a>

    <form class="card box" id="form">
      <p class="kicker">أهلاً بك</p>
      <h1>دخول العملاء</h1>
      <p class="muted">تسجيل الدخول لمتابعة محادثات المنشأة.</p>

      <div class="field">
        <input id="username" name="username" autocomplete="username" required autofocus placeholder=" ">
        <label for="username">اسم المستخدم</label>
      </div>

      <div class="field">
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder=" ">
        <label for="password">كلمة المرور</label>
      </div>

      <div id="totpStep" hidden>
        <div class="field">
          <input id="code" name="code" dir="ltr" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="14" placeholder=" ">
          <label for="code">رمز التحقق</label>
        </div>
        <p class="hint">من تطبيق المصادقة على جوالك، أو أحد رموز الاسترجاع.</p>
      </div>

      <div id="newPassword" hidden>
        <div class="field">
          <input id="fresh" type="password" autocomplete="new-password" placeholder=" ">
          <label for="fresh">كلمة المرور الجديدة</label>
        </div>
      </div>

      <button class="btn wide" type="submit" id="submit">دخول</button>
      <p class="hint" style="text-align:center;margin-top:16px">
        <a href="#" id="forgot">نسيت كلمة المرور؟</a>
      </p>
      <div id="error" class="error" hidden></div>
      <div id="note" class="ok" hidden></div>
    </form>
  </div>

  <script type="module">
    const form = document.getElementById('form');
    const errorBox = document.getElementById('error');
    const totpStep = document.getElementById('totpStep');
    const submit = document.getElementById('submit');
    const newPasswordField = document.getElementById('newPassword');

    /**
     * الدخول خطوتان حين يكون التحقق مفعّلاً.
     *
     * نفس النموذج ينتقل من خطوة إلى خطوة بدل صفحة ثانية: خطوة الرمز
     * مؤقتها خمس دقائق، وتحميل صفحة جديدة يضيّع منها ثوانيَ بلا داعٍ.
     */
    let stage = 'password';

    /**
     * الاسترجاع داخل نفس النموذج لا في صفحة ثانية.
     *
     * من نسي كلمته يكتب اسمه مرة واحدة: الحقل مملوء أمامه أصلاً،
     * ونقله لصفحة أخرى يجعله يكتبه من جديد ثم يعود ليكتب كلمته الجديدة.
     */
    const forgot = document.getElementById('forgot');
    const note = document.getElementById('note');
    const passwordField = document.getElementById('password').closest('.field');

    function show(kind, text) {
      errorBox.hidden = kind !== 'error';
      note.hidden = kind !== 'ok';
      (kind === 'error' ? errorBox : note).textContent = text;
    }

    forgot.onclick = async (event) => {
      event.preventDefault();
      if (!form.username.value.trim()) {
        show('error', 'اكتب اسم المستخدم أولاً.');
        form.username.focus();
        return;
      }

      forgot.textContent = 'جارٍ الإرسال…';
      const { data } = await send('/api/forgot', { username: form.username.value });
      forgot.hidden = true;

      stage = 'reset';
      passwordField.hidden = true;
      totpStep.hidden = false;
      form.code.placeholder = ' ';
      document.querySelector('label[for="code"]').textContent = 'الرمز الذي وصلك';
      document.querySelector('#totpStep .hint').textContent =
        'ثم اكتب كلمة المرور الجديدة (٨ أحرف فأكثر).';

      newPasswordField.hidden = false;
      submit.textContent = 'تعيين كلمة المرور';
      show('ok', data.message || 'إن كان الحساب موجوداً، وصلك رمز على واتساب.');
      form.code.focus();
    };

    async function send(url, payload) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await response.json().catch(() => ({}));
      return { ok: response.ok, data };
    }

    if (new URLSearchParams(location.search).get('done')) {
      show('ok', 'غُيّرت كلمة المرور. سجّل الدخول بها الآن.');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      note.hidden = true;
      submit.disabled = true;

      try {
        if (stage === 'reset') {
          const { ok, data } = await send('/api/reset', {
            username: form.username.value,
            code: form.code.value,
            password: document.getElementById('fresh').value,
          });
          if (!ok) throw new Error(data.error || 'تعذّر التعيين.');

          // العودة لشاشة الدخول لا الدخول مباشرة: من يعرف كلمته الجديدة
          // يكتبها مرة فتثبت في ذهنه وفي مدير كلمات المرور عنده.
          location.href = '/login.html?done=1';
          return;
        }

        if (stage === 'password') {
          const { ok, data } = await send('/api/login', {
            username: form.username.value,
            password: form.password.value,
          });
          if (!ok) throw new Error(data.error || 'تعذّر تسجيل الدخول.');

          if (data.needTotp) {
            stage = 'totp';
            totpStep.hidden = false;
            form.username.readOnly = true;
            form.password.readOnly = true;
            submit.textContent = 'تأكيد';
            form.code.focus();
            return;
          }
          location.href = '/app';
          return;
        }

        const { ok, data } = await send('/api/login/totp', { code: form.code.value });
        if (!ok) throw new Error(data.error || 'رمز غير صحيح.');
        location.href = '/app';
      } catch (error) {
        show('error', error.message);
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
