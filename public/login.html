<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — منصة بوت واتساب</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    .box { width: min(360px, 92vw); }
    .box h1 { font-size: 20px; margin: 0 0 2px; }
  </style>
</head>
<body>
  <form class="card box" id="form">
    <h1>منصة بوت واتساب</h1>
    <p class="muted" style="margin-top:0">سجّلي الدخول للمتابعة</p>
    <div id="error" class="error" hidden></div>
    <label for="username">اسم المستخدم</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">كلمة المرور</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="actions"><button class="btn" type="submit" style="flex:1">دخول</button></div>
  </form>

  <script type="module">
    const form = document.getElementById('form');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value,
        }),
      });
      if (response.ok) {
        location.href = '/';
        return;
      }
      const data = await response.json().catch(() => ({}));
      errorBox.textContent = data.error || 'تعذّر تسجيل الدخول.';
      errorBox.hidden = false;
    });
  </script>
</body>
</html>
