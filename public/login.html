<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — منصة بوت واتساب</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    .box { width: min(360px, 92vw); }
    .box h1 { font-size: 20px; margin: 0 0 2px; }
  </style>
</head>
<body>
  <form class="card box" id="form">
    <h1>منصة بوت واتساب</h1>
    <p class="muted" style="margin-top:0">سجّلي الدخول للمتابعة</p>
    <div id="error" class="error" hidden></div>
    <label for="username">اسم المستخدم</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">كلمة المرور</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div id="totpStep" hidden>
      <label for="code">رمز التحقق</label>
      <input id="code" name="code" dir="ltr" inputmode="numeric" autocomplete="one-time-code"
             maxlength="14" placeholder="123456">
      <p class="muted" style="margin:6px 0 0">
        من تطبيق المصادقة على جوالك، أو أحد رموز الاسترجاع.
      </p>
    </div>

    <div class="actions"><button class="btn" type="submit" id="submit" style="flex:1">دخول</button></div>
  </form>

  <script type="module">
    const form = document.getElementById('form');
    const errorBox = document.getElementById('error');
    const totpStep = document.getElementById('totpStep');
    const submit = document.getElementById('submit');

    /**
     * الدخول خطوتان حين يكون التحقق مفعّلاً.
     *
     * نفس النموذج ينتقل من خطوة إلى خطوة بدل صفحة ثانية: خطوة الرمز
     * مؤقتها خمس دقائق، وتحميل صفحة جديدة يضيّع منها ثوانيَ بلا داعٍ.
     */
    let stage = 'password';

    async function send(url, payload) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await response.json().catch(() => ({}));
      return { ok: response.ok, data };
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      submit.disabled = true;

      try {
        if (stage === 'password') {
          const { ok, data } = await send('/api/login', {
            username: form.username.value,
            password: form.password.value,
          });
          if (!ok) throw new Error(data.error || 'تعذّر تسجيل الدخول.');

          if (data.needTotp) {
            stage = 'totp';
            totpStep.hidden = false;
            form.username.readOnly = true;
            form.password.readOnly = true;
            submit.textContent = 'تأكيد';
            form.code.focus();
            return;
          }
          location.href = '/app';
          return;
        }

        const { ok, data } = await send('/api/login/totp', { code: form.code.value });
        if (!ok) throw new Error(data.error || 'رمز غير صحيح.');
        location.href = '/app';
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.hidden = false;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
