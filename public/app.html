<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
</head>
<body>
  <div id="root">
    <div class="empty" id="boot">جارٍ التحميل…</div>
  </div>

  <script type="module" src="/js/app.js"></script>
  <script>
    // حارس الإقلاع: لو فشل تحميل الوحدات نُظهر السبب بدل تعليق الصفحة.
    setTimeout(() => {
      const boot = document.getElementById('boot');
      if (boot && boot.isConnected) {
        boot.innerHTML =
          '<div class="error">تعذّر إقلاع الواجهة. يلزم التأكد من أن الخادم يعمل، ثم إعادة التحميل.</div>' +
          '<button class="btn" onclick="location.reload()">إعادة المحاولة</button>';
      }
    }, 10000);
  </script>
</body>
</html>
